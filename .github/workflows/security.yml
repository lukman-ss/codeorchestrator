name: Security & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Security Scan & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c376166672c3f2f2378f8 # v2.11.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security check script
        run: bash scripts/security-check.sh

      - name: Run dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated test suite
        run: npm test
        env:
          ORCHESTRATOR_API_TOKEN: test-token-123
          REQUIRE_AUTH: "true"
          NODE_ENV: test
